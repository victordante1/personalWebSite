<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- Cursor de lápis em preto e branco, no estilo do cursor padrão (contorno preto, miolo branco).
       A ponta fica em (3, 29): é o "hotspot" usado no CSS (cursor: url(...) 3 29). -->
  <g stroke="#000" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round">
    <!-- corpo -->
    <polygon points="10.21,26.31 22.23,14.29 17.71,9.77 5.69,21.79" fill="#fff"/>
    <!-- madeira apontada -->
    <polygon points="3,29 10.21,26.31 5.69,21.79" fill="#fff"/>
    <!-- virola -->
    <polygon points="22.23,14.29 24.71,11.81 20.19,7.29 17.71,9.77" fill="#000"/>
    <!-- borracha -->
    <polygon points="24.71,11.81 26.47,10.05 21.95,5.53 20.19,7.29" fill="#fff"/>
  </g>
  <!-- grafite -->
  <polygon points="3,29 5.68,28 4,26.32" fill="#000"/>
</svg>
